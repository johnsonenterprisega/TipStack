name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at midnight UTC to prevent Supabase inactivity pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Auth API
        run: |
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://eosbtwubpzoogpvajyyk.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2J0d3VicHpvb2dwdmFqeXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDkxMjgsImV4cCI6MjEwMjk4NTEyOH0.elGLlBOARK-B41GoftUCFeDSgJ7788oWqHdG3CxEdUI' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2J0d3VicHpvb2dwdmFqeXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDkxMjgsImV4cCI6MjEwMjk4NTEyOH0.elGLlBOARK-B41GoftUCFeDSgJ7788oWqHdG3CxEdUI' }}")
          
          echo "Supabase REST API returned HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Supabase project is active and healthy!"
          else
            echo "⚠️ Unexpected status code: $HTTP_STATUS"
          fi
